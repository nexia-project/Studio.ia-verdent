name: Generate Complete Lockfile

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9
    
    - name: Clean everything
      run: |
        rm -f pnpm-lock.yaml
        rm -rf node_modules
        rm -rf apps/*/node_modules
        rm -rf packages/*/node_modules
    
    - name: Generate fresh pnpm-lock.yaml
      run: |
        pnpm install --no-frozen-lockfile
        echo "Lockfile generated successfully"
        ls -la pnpm-lock.yaml
        wc -l pnpm-lock.yaml
    
    - name: Verify lockfile
      run: |
        if [ -s pnpm-lock.yaml ]; then
          echo "Lockfile is not empty"
          head -50 pnpm-lock.yaml
        else
          echo "Lockfile is empty!"
          exit 1
        fi
    
    - name: Commit and push lockfile
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add pnpm-lock.yaml
        git status
        git diff --staged --quiet || (git commit -m "Add complete pnpm-lock.yaml" && git push)
